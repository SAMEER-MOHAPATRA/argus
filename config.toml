[discovery]
max_per_feed = 25

role_keywords = [
    "data analyst",
    "business analyst",
    "data analytics",
    "analytics analyst",
    "reporting analyst",
    "bi analyst",
    "power bi",
    "sql analyst",
    "insights analyst",
    "analytics engineer",
    "sql developer",
    "database analyst",
    "junior data scientist",
    "entry level data scientist",
    "data science intern",
]

seniority_block = [
    "senior",
    "lead",
    "manager",
    "director",
    "sr.",
    "head of",
    "principal",
    "vp ",
    "vice president",
]

