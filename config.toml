[discovery]
max_per_feed = 25

role_keywords = [
    "data analyst",
    "business analyst",
    "data analytics",
    "analytics analyst",
    "reporting analyst",
    "bi analyst",
    "power bi",
    "sql analyst",
    "insights analyst",
    "analytics engineer",
    "sql developer",
    "database analyst",
    "junior data scientist",
    "entry level data scientist",
    "data science intern",
]

seniority_block = [
    "senior",
    "lead",
    "manager",
    "director",
    "sr.",
    "head of",
    "principal",
    "vp ",
    "vice president",
]

# RemoteOK RSS was removed on their side: every .rss path answers HTTP 410 Gone,
# including the general remote-jobs.rss. feedparser reported this as a "mismatched
# tag" because it was parsing the HTML error page. Their JSON API
# (https://remoteok.com/api) still works, but feedparser only reads RSS, so
# using it needs code. Do not re-add these URLs.

[[discovery.feeds]]
label = "WWR | Programming"
url = "https://weworkremotely.com/categories/remote-programming-jobs.rss"

[[discovery.feeds]]
label = "WWR | All"
url = "https://weworkremotely.com/remote-jobs.rss"

[[discovery.feeds]]
label = "Himalayas | Remote"
url = "https://himalayas.app/jobs/rss"

[[discovery.feeds]]
label = "LinkedIn | DA India"
url = "https://news.google.com/rss/search?q=site%3Alinkedin.com%2Fjobs+%22data+analyst+India%22&hl=en-IN&gl=IN&ceid=IN:en"

[[discovery.feeds]]
label = "LinkedIn | BA India"
url = "https://news.google.com/rss/search?q=site%3Alinkedin.com%2Fjobs+%22business+analyst+India%22&hl=en-IN&gl=IN&ceid=IN:en"

[[discovery.feeds]]
label = "LinkedIn | DA Remote"
url = "https://news.google.com/rss/search?q=site%3Alinkedin.com%2Fjobs+%22data+analyst+remote%22&hl=en-IN&gl=IN&ceid=IN:en"

[[discovery.feeds]]
label = "LinkedIn | Analytics Eng"
url = "https://news.google.com/rss/search?q=site%3Alinkedin.com%2Fjobs+%22analytics+engineer%22&hl=en-IN&gl=IN&ceid=IN:en"

[[discovery.feeds]]
label = "WWR | Mgmt & Finance"
url = "https://weworkremotely.com/categories/remote-management-and-finance-jobs.rss"

# Remotive: .com is Cloudflare-walled and category filtering is ignored;
# .io mirror serves the general feed, which discover.py filters by role keywords anyway.
[[discovery.feeds]]
label = "Remotive | Remote"
url = "https://remotive.io/remote-jobs/feed"

# Naukri has no public RSS (/rss-feed-jobs is a keyword search page, and the
# site 403s non-browser user agents). Google News indexes Naukri job pages,
# so scope a news search to the site — same trick as the LinkedIn feeds above.
[[discovery.feeds]]
label = "Naukri | DA India"
url = "https://news.google.com/rss/search?q=site%3Anaukri.com+%22data+analyst%22&hl=en-IN&gl=IN&ceid=IN:en"

[[discovery.feeds]]
label = "Naukri | BA India"
url = "https://news.google.com/rss/search?q=site%3Anaukri.com+%22business+analyst%22&hl=en-IN&gl=IN&ceid=IN:en"

[[discovery.feeds]]
label = "Naukri | Analytics"
url = "https://news.google.com/rss/search?q=site%3Anaukri.com+%22analytics%22&hl=en-IN&gl=IN&ceid=IN:en"
